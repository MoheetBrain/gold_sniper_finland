# =============================================================================
# GeoArb_Finland — Step 1 configuration
# AI-assisted Finland gold prospect-generation (legal-availability engine).
#
# This config drives the Step 1 scripts. Edit values here rather than hard-coding
# them in scripts. All spatial work uses EPSG:3067 (ETRS89 / TM35FIN).
# =============================================================================

project:
  name: GeoArb_Finland
  country: Finland
  region: Central Lapland Greenstone Belt
  deposit_model: Orogenic Gold
  crs: "EPSG:3067"          # ETRS89 / TM35FIN — the standard CRS for everything

# -----------------------------------------------------------------------------
# Paths (relative to repo root). Scripts resolve these against the project root,
# so you can run scripts from anywhere.
# -----------------------------------------------------------------------------
paths:
  raw: data/raw
  tukes_zip: data/raw/tukes_zip
  tukes_extracted: data/raw/tukes_extracted
  debug: data/raw/debug
  restrictions: data/raw/restrictions
  interim: data/interim
  processed: data/processed
  outputs: data/outputs

# -----------------------------------------------------------------------------
# Tukes mining-register map files.
#
# Source page (human):
#   https://tukes.fi/en/mining-ore-prospecting-and-gold-panning/map-files
# Machine-readable ATOM feed that actually lists the ZIPs (parsed by script 00):
#   https://tukes.fi/karttatiedostot-rss-atomfeedina?p_p_id=fi_yja_feedbuilder_FeedXmlViewPortlet&p_p_lifecycle=2&p_p_state=normal&p_p_mode=view&p_p_cacheability=cacheLevelPage
#
# The ZIP file names are dated (e.g. valtaus_2026-06-02.zip) and change over time,
# so the downloader scrapes the feed instead of hard-coding URLs.
#
# `layer_keywords` are the Finnish filename stems we care about. A ZIP is selected
# if its filename contains any of these keywords.
# -----------------------------------------------------------------------------
tukes:
  base_url: "https://tukes.fi"
  feed_url: "https://tukes.fi/karttatiedostot-rss-atomfeedina?p_p_id=fi_yja_feedbuilder_FeedXmlViewPortlet&p_p_lifecycle=2&p_p_state=normal&p_p_mode=view&p_p_cacheability=cacheLevelPage"
  # Fallback page if the ATOM feed disappears; the script will scrape it for .zip hrefs.
  fallback_page_url: "https://tukes.fi/karttatiedostot-rss-atomfeedina"
  request_timeout_s: 60
  layer_keywords:
    - malminetsintavaraus   # exploration reservation  (Malminetsintävaraus)
    - malminetsinta         # exploration permits      (Malminetsintäluvat)
    - kaivosalue            # mining-permit area       (Kaivoslupa / Kaivosalue)
    - kaivospiiri           # mining concession        (Kaivospiiri)
    - valtaus               # claim                    (Valtaus)
    - kullanhuuhdonta       # gold panning permit      (Kullanhuuhdonta)
  # If a ZIP exists in both MIF and SHP/TAB variants, prefer the one whose name
  # contains this token (we read shapefiles with pyogrio).
  prefer_format_token: "shp"

# -----------------------------------------------------------------------------
# Area of interest (AOI) and grid.
#
# Default AOI is a broad Central Lapland box in EPSG:3067 covering the greenstone
# belt from the Kittilä/Ikkari area in the west to Sodankylä in the east, and the
# Sirkka / Kiistala shear-zone corridor. Tighten these bounds later to focus.
#
# Quick orientation (EPSG:3067, approx):
#   Kittilä town    ~ (380 000, 7 530 000)
#   Ikkari/Rupert   ~ (385 000, 7 510 000)
#   Sodankylä       ~ (485 000, 7 480 000)
# -----------------------------------------------------------------------------
aoi:
  # Bounding box in EPSG:3067 metres: [xmin, ymin, xmax, ymax]
  bounds: [350000, 7450000, 530000, 7620000]
  cell_size_m: 5000          # 5 km x 5 km default grid cells

# -----------------------------------------------------------------------------
# Legal-status thresholds for classifying AOI cells by how much of the cell is
# covered by Tukes rights polygons (taken_overlap_pct = % of cell area taken).
# -----------------------------------------------------------------------------
legal_status:
  open_max_pct: 1.0          # 0   <= pct <= 1   -> open
  partly_taken_max_pct: 10.0 # 1   <  pct <= 10  -> partly_taken
  # pct > 10 -> taken
  # is_clean_open is a stricter flag: True only when pct == 0 exactly.

# -----------------------------------------------------------------------------
# Demo ranker (Step 1 sanity check only — NOT geology).
# -----------------------------------------------------------------------------
demo_rank:
  random_seed: 42            # reproducible fake scores
  top_n_in_summary: 20

# =============================================================================
# STEP 1.5 — shrink & harden the search space
# =============================================================================

# -----------------------------------------------------------------------------
# Central Lapland Greenstone Belt (CLGB) clipping (script 04b).
#
# PREFERRED: real GTK bedrock geology. Drop a polygon layer at `gtk_bedrock_path`
# and set the lithology field + greenstone keywords; 04b will dissolve the matching
# polygons into the CLGB clip.
#
# FALLBACK (no GTK data yet): an APPROXIMATE manual envelope polygon (EPSG:3067)
# around the Kittilä–Sirkka–Kiistala–Sodankylä gold corridor. This is NOT a
# geological boundary — it is a coarse geographic swath to trim obvious basement
# corners off the bounding box. Replace it with real GTK greenstone polygons before
# Step 2 modelling. Vertices are [easting, northing] in metres, in order.
# -----------------------------------------------------------------------------
clgb:
  gtk_bedrock_path: data/raw/gtk/bedrock_geology.gpkg   # supply this for the real clip
  greenstone_field: ""        # e.g. "ROCK_NAME" / "lithology" — set when GTK data present
  greenstone_keywords:        # case-insensitive substrings selecting greenstone lithologies
    - greenstone
    - metavolcan
    - mafic volcan
    - komatiite
    - tholeiit
    - amphibolite
    - metabasalt
  # Approximate manual envelope (used ONLY if the GTK bedrock file is absent).
  manual_envelope_3067:
    - [362000, 7505000]
    - [362000, 7575000]
    - [430000, 7610000]
    - [505000, 7575000]
    - [505000, 7498000]
    - [430000, 7470000]
  # Keep a grid cell if its centroid falls inside the CLGB polygon.
  keep_rule: centroid_within

# -----------------------------------------------------------------------------
# Finer modelling grids (scripts 04b / 04). 5 km stays the regional overview.
# -----------------------------------------------------------------------------
grids:
  regional_overview_m: 5000   # existing aoi_grid
  regional_rank_m: 2000       # 2 km — regional ranking
  target_detail_m: 1000       # 1 km — target-memo detail

# -----------------------------------------------------------------------------
# Restriction masks (script 04c). Each entry: a subfolder under data/raw/restrictions/
# and whether it is a HARD exclusion. 04c loads any vector files found inside, unions
# them, and intersects with the grid. Missing folders are reported, never invented.
# -----------------------------------------------------------------------------
restrictions:
  # priority order matters for reporting
  layers:
    - {folder: natura2000,          hard: true,  label: "Natura 2000"}
    - {folder: protected_areas,     hard: true,  label: "Protected areas"}
    - {folder: national_parks,      hard: true,  label: "National parks"}
    - {folder: wilderness_areas,    hard: true,  label: "Wilderness areas"}
    - {folder: sami_homeland,       hard: true,  label: "Sámi Homeland"}
    - {folder: water_bodies,        hard: true,  label: "Water bodies / lakes"}
    - {folder: urban_infrastructure, hard: false, label: "Urban / infrastructure"}
    - {folder: reindeer_herding,    hard: false, label: "Reindeer herding"}
    - {folder: landuse_zoning,      hard: false, label: "Land-use / zoning"}
  # A cell is "restricted" if hard-restriction overlap exceeds this %.
  restricted_max_open_pct: 1.0

# -----------------------------------------------------------------------------
# Gold-panning (kullanhuuhdonta) scenarios (script run_step1_5).
#   A: exclude ALL Tukes rights, including gold-panning (placer) permits.
#   B: exclude exploration/mining/claim/reservation rights, but NOT gold-panning
#      (report gold-panning separately — it is placer, not hard-rock).
# This is a modelling choice, NOT a legal decision. Both are produced.
# -----------------------------------------------------------------------------
gold_panning:
  layer_stem: kullanhuuhdonta

# =============================================================================
# STEP 2 — minimal source-grounded geology modelling
# =============================================================================

# -----------------------------------------------------------------------------
# GTK open data (script 05). Pulled AOI-clipped from GTK's public ArcGIS REST
# server (product-specific rights must be checked; see DATA_SOURCES_AND_LICENSES.md). `native_wkid` is each service's own CRS; the query
# sends the AOI bbox in that CRS and asks the server to return EPSG:3067 geometry.
# `out` is relative to data/raw/. kind drives downstream use.
# -----------------------------------------------------------------------------
gtk:
  arcgis_root: "https://gtkdata.gtk.fi/arcgis/rest/services"
  query_aoi_3067: [350000, 7450000, 530000, 7620000]
  request_timeout_s: 60
  page_size: 1000
  layers:
    - {name: fodd_precious_metals, service: "Fodd/fodd_FDM_v5", layer: 39, native_wkid: 25834, out: "gtk/fodd_precious_metals.gpkg", kind: deposits}
    - {name: gold_mines,           service: "MDaE/Mines_deposits", layer: 5, native_wkid: 3067, out: "gtk/gold_mines.gpkg", kind: deposits}
    - {name: structures,           service: "GTK_Bedrock_and_Superficial_Geology", layer: 0, native_wkid: 4326, out: "gtk/structures.gpkg", kind: structures}
    - {name: bedrock,              service: "GTK_Bedrock_and_Superficial_Geology", layer: 3, native_wkid: 4326, out: "gtk/bedrock.gpkg", kind: bedrock}
    - {name: natura2000,           service: "MDaE/NatureETC", layer: 1, native_wkid: 3067, out: "restrictions/natura2000/natura2000.gpkg", kind: restriction}
    - {name: protected_areas,      service: "MDaE/NatureETC", layer: 2, native_wkid: 3067, out: "restrictions/protected_areas/protected_areas.gpkg", kind: restriction}
    - {name: groundwater,          service: "MDaE/NatureETC", layer: 0, native_wkid: 3067, out: "restrictions/water_bodies/groundwater.gpkg", kind: restriction}
  # Datasets NOT available as queryable REST features (rasters / not served) — these
  # become null feature columns + a download checklist, never invented.
  missing_expected:
    - {feature: "mag_1vd", dataset: "Airborne magnetics (TMI grid)", source: "GTK Hakku airborne geophysics — https://hakku.gtk.fi"}
    - {feature: "mag_low_in_high_proxy", dataset: "Airborne magnetics (TMI grid)", source: "GTK Hakku"}
    - {feature: "gravity_gradient", dataset: "Gravity grid", source: "GTK / National Land Survey gravity database"}
    - {feature: "till_au_clr/as/sb/bi", dataset: "Till geochemistry (regional/fine)", source: "GTK Hakku geochemistry — Sn/till survey"}

step2:
  primary_grid: "clgb_grid_2km.gpkg"   # 2 km first
  fine_grid: "clgb_grid_1km.gpkg"

# -----------------------------------------------------------------------------
# CLGB orogenic-gold label rules (script 07). Filter FODD GENETIC_TYPE.
# -----------------------------------------------------------------------------
labels:
  genetic_field: "GENETIC_TYPE"
  commodity_field: "MAIN_COMMODITIES"
  name_field: "NAME"
  include_genetic_keywords:        # CLGB-compatible orogenic gold only
    - "orogenic gold"
  exclude_genetic_keywords:        # contaminating non-CLGB systems
    - "iron oxide-copper-gold"
    - "iocg"
    - "uranium"
    - "au-u"
    - "co-u"
    - "kuusamo"
    - "volcanogenic"
    - "vms"
    - "epithermal"
    - "porphyry"
    - "intrusion-related"
    - "intrusion related"
    - "placer"
    - "paleoplacer"
    - "skarn"

# -----------------------------------------------------------------------------
# Background / unlabelled sampling (script 08).
# -----------------------------------------------------------------------------
background:
  positive_exclusion_buffer_m: 5000   # don't sample background within 5 km of a positive
  random_seed: 42

# -----------------------------------------------------------------------------
# Spatial block cross-validation (script 09).
# -----------------------------------------------------------------------------
spatial_blocks:
  block_size_m: 20000                 # 20 km x 20 km blocks

# -----------------------------------------------------------------------------
# Till-shift ablation (script 11c / feature stack).
# Regional ice flow in Central Lapland was broadly NW -> SE; till is transported
# DOWN-ice (toward SE), so the bedrock source is UP-ice (toward NW). We shift till
# sample points up-ice by several distances and compare. PROVISIONAL until a real
# ice-flow / glacial-landform layer is supplied.
# -----------------------------------------------------------------------------
till_shift:
  ice_flow_to_azimuth_deg: 135        # direction ice/till moved TOWARD (deg from N) — PROVISIONAL
  shifts_m: [0, 500, 1000, 2000]      # 0 = raw; up-ice shifts
  long_shift_m: 5000                  # used only if streamlined-moraine data exists
  provisional: true
